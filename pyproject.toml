[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smf-swarm"
version = "1.7.2"
description = "SMF Swarm — Custom sequential hybrid pipeline with adversarial debate and social calibration layers for agent-powered predictive analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SMF Works", email = "michael@smfworks.com"},
]
keywords = ["prediction", "llm", "agents", "forecasting", "swarm", "debate", "social", "calibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pydantic>=2.0.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "PyPDF2>=3.0.0",
    "diskcache>=5.6.0",
]

[project.optional-dependencies]
predict = [
    "prophet>=1.1.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
]
trust = [
    "keyring>=25.0.0",
]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.5.0",
]
langgraph = [
    "langgraph>=0.3.0",
]
cli = [
    "rich>=13.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
benchmark = [
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
]
conformal = [
    "mapie>=0.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
smf-swarm = "smf_swarm.cli:main"

[project.urls]
Homepage = "https://github.com/smfworks/smf-swarm"
Documentation = "https://github.com/smfworks/smf-swarm/tree/main/docs"
Repository = "https://github.com/smfworks/smf-swarm"
Issues = "https://github.com/smfworks/smf-swarm/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/smf_swarm"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/install.sh",
    "/install.ps1",
    "/install.bat",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
